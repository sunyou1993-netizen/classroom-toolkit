<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>환경보호 O/X 퀴즈</title>
    <!-- Google Fonts for Chalkboard & UI Aesthetics -->
    <!-- Pretendard WebFont -->
    <!-- Main Style CSS -->
      <link rel="stylesheet" href="../fonts/fonts.css">
    <script type="module" crossorigin src="./assets/index-D5mT4lkU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BXQ3NjQK.css">
  </head>
  <body>
    <!-- Fixed 1080x1920 Signage Outer Wrapper -->
    <div id="stage-container">
      <div id="app-stage" class="signage-canvas">
        <!-- TOP-LEFT GLOBAL BACK BUTTON -->
        <button id="btn-global-back" class="kiosk-back-btn" aria-label="뒤로가기">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>

        <!-- MAIN VIEW CONTAINER (Fills space between Header and Bottom CTA) -->
        <main id="view-container" class="kiosk-main">
          <!-- Views will be dynamically rendered here by main.js -->
        </main>

        <!-- BOTTOM CTA CONTAINER (Height: 240px) -->
        <footer id="app-footer" class="kiosk-footer">
          <!-- Dynamic CTA buttons injected by main.js -->
        </footer>
      </div>
    </div>

    <!-- Main JS Module -->
  <script>
/* 문제를 다 풀고 나면 결과 창이 화면 전체를 덮어서, 아래에 있는
   "뒤로" 버튼을 누를 수 없었습니다. 결과 창 안에 목록으로 돌아가는
   버튼을 하나 더 넣어 줍니다. */
(function () {
  function goList() {
    try { (window.top || window).location.href = '../'; }
    catch (e) { window.location.href = '../'; }
  }
  function addBtn() {
    var dlg = document.querySelector('.result-overlay .result-dialog');
    if (!dlg || dlg.querySelector('#btn-go-list')) return;
    var wrap = document.createElement('div');
    wrap.style.cssText = 'width:100%;margin-top:16px;';
    var b = document.createElement('button');
    b.id = 'btn-go-list';
    b.textContent = '목록으로';
    b.style.cssText = 'height:108px;width:100%;font-size:34px;font-weight:700;' +
      'border-radius:24px;border:3px solid #cbd5e1;background:#fff;color:#334155;';
    b.addEventListener('click', goList);
    wrap.appendChild(b);
    dlg.appendChild(wrap);
  }
  new MutationObserver(addBtn).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', addBtn);
})();
</script>
</body>
</html>
