<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>간단교육 퀴즈</title>
    <!-- DNS Prefetch & Preconnect & Prefetch for lightning fast external quiz iframe loading -->
    <!-- Pretendard Web Font -->
    <!-- Separate CSS Stylesheet -->
      <link rel="stylesheet" href="./fonts/fonts.css">
    <script type="module" crossorigin src="./assets/index-CFF_0IS4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BH_A0YdW.css">
  <style id="contrast-bump">
/* 보조 글자를 한 단계 진하게 (scripts/fix-contrast.mjs)
   slate-400 은 흰 바탕에서 2.63:1 이라 국제 기준(4.5:1)에 못 미칩니다.
   같은 계열의 slate-500 으로 한 단계만 내려 4.76:1 을 맞춥니다.
   배경·테두리는 그대로 두고 글자 색만 바꿉니다. */
.text-slate-400 { color: #64748B !important; }
.stat-title,
.bar-progress-label,
.backing-volume-label { color: #64748B !important; }   /* 피아노 정확도·진행도·마디·반주 소리 */

/* 타이머의 "다같이 시작해볼까요?" 는 위 utility 를 쓰지 않고 색을 직접 씁니다 */
[class*="text-slate-400"] { color: #64748B !important; }
</style>
<style id="reduced-motion">
/* 기기에서 '동작 줄이기'를 켠 경우에만 적용됩니다 (scripts/fix-reduced-motion.mjs).
   켜지 않은 사람에게는 아무 변화도 없습니다. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
  <body style="background-color: #FFFFFF; margin: 0; padding: 0; overflow: hidden;">
    <!-- Full-Screen Pure White Initial Loading Overlay with Interaction -->
    <div id="initial-app-loader" class="initial-app-loading-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #FFFFFF !important; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div class="iframe-top-progress"></div>
      <div class="loading-interaction-wrapper">
        <div class="loading-pulse-ring"></div>
        <div class="loading-spinner"></div>
      </div>
      <p class="loading-text">스마트 교육 퀴즈</p>
      <p class="loading-subtext">콘텐츠를 불러오는 중입니다...</p>
    </div>

    <!-- 1080x1920 Signage Viewport -->
    <div id="signage-viewport" style="background-color: #FFFFFF;">
      <div id="app" class="signage-canvas" style="background-color: #FFFFFF; background-image: none;">
        <!-- Main Signage Kiosk Content will be dynamically rendered here -->
      </div>
    </div>
    <!-- Separate JS Controller Script -->
  <style id="kiosk-guard">
  * { -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; }
</style>
<script data-kiosk-guard>
  /* 길게 누르기 메뉴와 두 손가락 확대만 막습니다.
     앱이 가진 기능은 그대로 두고, 브라우저 기본 동작만 취소합니다. */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
</script>
<style id="font-pretendard">
  /* 글꼴 파일을 이 화면에 직접 연결합니다(빠져 있던 화면이 있었습니다) */
  @font-face {
    font-family: "Pretendard";
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url("./fonts/PretendardVariable.woff2") format("woff2-variations");
  }
  /* 앱마다 제각각이던 글꼴 변수도 전부 Pretendard 로 */
  :root {
    --font-sans: "Pretendard", sans-serif !important;
    --font-mono: "Pretendard", monospace !important;
    --font-rounded: "Pretendard", sans-serif !important;
    --font-display: "Pretendard", sans-serif !important;
  }
  /* 모든 글자를 Pretendard 로. 이모지는 자동으로 시스템 이모지로 넘어갑니다. */
  *, *::before, *::after {
    font-family: "Pretendard", "Hanja", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif !important;
  }
  /* 숫자가 바뀔 때 자리폭이 흔들리지 않게 (타이머·스톱워치) */
  body { font-variant-numeric: tabular-nums; }
</style>
<style id="font-hanja">
  /* 한자 글꼴 — Pretendard 에 한자가 한 글자도 없어서 따로 담았습니다.
     Noto Sans CJK KR 에서 실제로 쓰는 한자 387자만 뽑은 파일입니다(SIL 오픈폰트 라이선스). */
  @font-face {
    font-family: "Hanja";
    font-style: normal;
    font-display: swap;
    src: url("./fonts/HanjaSubset.woff2") format("woff2");
    /* 한자 영역만 이 글꼴을 쓰게 해서, 한글은 Pretendard 가 그대로 맡습니다. */
    unicode-range: U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
  }
</style>
</body>
</html>
