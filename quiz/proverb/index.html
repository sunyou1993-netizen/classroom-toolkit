<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>속담 맞추기</title>
<meta name="theme-color" content="#006CFF">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:linear-gradient(to bottom, #f3e0c1 0%, #ecd9b0 50%, #7a6936 100%);
               touch-action:manipulation; overscroll-behavior:none;
               -webkit-user-select:none; user-select:none;
               -webkit-tap-highlight-color:transparent; }
  #stage { position:absolute; top:0; left:0; width:1080px; height:1920px;
           transform-origin:top left; border:0; display:block; background:transparent; }
</style>
<style id="reduced-motion">
/* 기기에서 '동작 줄이기'를 켠 경우에만 적용됩니다 (scripts/fix-reduced-motion.mjs).
   켜지 않은 사람에게는 아무 변화도 없습니다. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<iframe id="stage" src="./app.html" title="속담 맞추기"
        allow="microphone; camera; autoplay; fullscreen; clipboard-write"></iframe>
<script>
  var APP = "app.html";
  var HOME = "../";
  var f = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    f.style.transform = 'scale(' + s + ')';
    f.style.left = ((window.innerWidth  - 1080 * s) / 2) + 'px';
    f.style.top  = ((window.innerHeight - 1920 * s) / 2) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  // 닫기 동작이 앱마다 제각각(허브로 이동 / window.close() / history.back())이라
  // 어떤 방식이든 전부 허브로 모아 줍니다.
  function goHub() {
    // 목록 화면에서는 이미 제자리이므로 아무것도 하지 않습니다.
    if (HOME) location.href = HOME;
  }
  f.addEventListener('load', function () {
    try {
      var w = f.contentWindow;
      var u = w.location;
      // 앱이 프레임 안에서 다른 곳으로 갔다면 창 전체를 그리로 옮깁니다.
      if (!u.pathname.endsWith(APP)) { window.location.href = u.href; return; }
      w.close = goHub;                       // 창 닫기 시도 → 허브
      var back = w.history.back.bind(w.history);
      w.history.back = function () {         // 뒤로가기 시도 → 갈 곳 없으면 허브
        if (w.history.length > 1) back(); else goHub();
      };
    } catch (e) {}
  });
  window.addEventListener('message', function (e) {   // 닫기 신호를 보내는 앱도 있습니다
    var d = e.data;
    if (d === 'close' || (d && d.type === 'close')) goHub();
  });
</script>
<style id="font-hanja">
  /* 한자 글꼴 — Pretendard 에 한자가 한 글자도 없어서 따로 담았습니다.
     Noto Sans CJK KR 에서 실제로 쓰는 한자 387자만 뽑은 파일입니다(SIL 오픈폰트 라이선스). */
  @font-face {
    font-family: "Hanja";
    font-style: normal;
    font-display: swap;
    src: url("../fonts/HanjaSubset.woff2") format("woff2");
    /* 한자 영역만 이 글꼴을 쓰게 해서, 한글은 Pretendard 가 그대로 맡습니다. */
    unicode-range: U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
  }
</style>
<script id="sw-register-quiz">
/* 파일을 미리 받아 두는 일꾼을 등록합니다 (scripts/fix-quiz-offline.mjs).
   수업도우미의 timer/index.html 등이 쓰는 것과 같은 코드입니다.
   이게 없으면 이 주소로 곧장 들어왔을 때 인터넷 없이 안 열립니다. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
  });
}
</script>
<script id="drop-guard">
/* 파일을 끌어다 놓아도 수업 화면을 벗어나지 않게 합니다 (scripts/fix-drop-guard.mjs).
   브라우저는 기본으로 끌어다 놓은 파일을 열어 버립니다. */
['dragenter', 'dragover', 'drop'].forEach(function (종류) {
  window.addEventListener(종류, function (e) { e.preventDefault(); }, false);
});
</script>
</body>
</html>
