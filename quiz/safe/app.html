<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>안전 퀴즈</title>
    <!-- Google Fonts for Chalkboard & UI Aesthetics -->
    <!-- Pretendard WebFont -->
    <!-- Main Style CSS -->
      <link rel="stylesheet" href="../fonts/fonts.css">
    <script type="module" crossorigin src="./assets/index-CmjevM14.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-gBeO7IXp.css">
  <style id="contrast-bump">
/* 보조 글자를 한 단계 진하게 (scripts/fix-contrast.mjs)
   slate-400 은 흰 바탕에서 2.63:1 이라 국제 기준(4.5:1)에 못 미칩니다.
   같은 계열의 slate-500 으로 한 단계만 내려 4.76:1 을 맞춥니다.
   배경·테두리는 그대로 두고 글자 색만 바꿉니다. */
.text-slate-400 { color: #64748B !important; }
.stat-title,
.bar-progress-label,
.backing-volume-label { color: #64748B !important; }   /* 피아노 정확도·진행도·마디·반주 소리 */

/* 타이머의 "다같이 시작해볼까요?" 는 위 utility 를 쓰지 않고 색을 직접 씁니다 */
[class*="text-slate-400"] { color: #64748B !important; }
</style>
<style id="reduced-motion">
/* 기기에서 '동작 줄이기'를 켠 경우에만 적용됩니다 (scripts/fix-reduced-motion.mjs).
   켜지 않은 사람에게는 아무 변화도 없습니다. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
  <body>
    <!-- Fixed 1080x1920 Signage Outer Wrapper -->
    <div id="stage-container">
      <div id="app-stage" class="signage-canvas">
        <!-- TOP-LEFT GLOBAL BACK BUTTON -->
        <a id="btn-global-back" class="kiosk-back-btn" href="../" target="_top" rel="noopener noreferrer" onclick="if(window.navigateToHomeUrl){window.navigateToHomeUrl(event);} return true;" aria-label="뒤로가기">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </a>

        <!-- MAIN VIEW CONTAINER (Fills space between Header and Bottom CTA) -->
        <main id="view-container" class="kiosk-main">
          <!-- Views will be dynamically rendered here by main.js -->
        </main>

        <!-- BOTTOM CTA CONTAINER (Height: 240px) -->
        <footer id="app-footer" class="kiosk-footer">
          <!-- Dynamic CTA buttons injected by main.js -->
        </footer>
      </div>
    </div>

    <!-- Main JS Module -->
  <script>
/* 문제를 다 풀고 나면 결과 창이 화면 전체를 덮어서, 아래에 있는
   "뒤로" 버튼을 누를 수 없었습니다. 결과 창 안에 목록으로 돌아가는
   버튼을 하나 더 넣어 줍니다. */
(function () {
  function goList() {
    try { (window.top || window).location.href = '../'; }
    catch (e) { window.location.href = '../'; }
  }
  function addBtn() {
    var dlg = document.querySelector('.result-overlay .result-dialog');
    if (!dlg || dlg.querySelector('#btn-go-list')) return;
    var wrap = document.createElement('div');
    wrap.style.cssText = 'width:100%;margin-top:16px;';
    var b = document.createElement('button');
    b.id = 'btn-go-list';
    b.textContent = '목록으로';
    b.style.cssText = 'height:108px;width:100%;font-size:34px;font-weight:700;' +
      'border-radius:24px;border:3px solid #cbd5e1;background:#fff;color:#334155;';
    b.addEventListener('click', goList);
    wrap.appendChild(b);
    dlg.appendChild(wrap);
  }
  new MutationObserver(addBtn).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', addBtn);
})();
</script>
<style id="kiosk-guard">
  * { -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; }
</style>
<script data-kiosk-guard>
  /* 길게 누르기 메뉴와 두 손가락 확대만 막습니다.
     앱이 가진 기능은 그대로 두고, 브라우저 기본 동작만 취소합니다. */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
</script>
<style id="font-pretendard">
  /* 글꼴 파일을 이 화면에 직접 연결합니다(빠져 있던 화면이 있었습니다) */
  @font-face {
    font-family: "Pretendard";
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url("../fonts/PretendardVariable.woff2") format("woff2-variations");
  }
  /* 앱마다 제각각이던 글꼴 변수도 전부 Pretendard 로 */
  :root {
    --font-sans: "Pretendard", sans-serif !important;
    --font-mono: "Pretendard", monospace !important;
    --font-rounded: "Pretendard", sans-serif !important;
    --font-display: "Pretendard", sans-serif !important;
  }
  /* 모든 글자를 Pretendard 로. 이모지는 자동으로 시스템 이모지로 넘어갑니다. */
  *, *::before, *::after {
    font-family: "Pretendard", "Hanja", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif !important;
  }
  /* 숫자가 바뀔 때 자리폭이 흔들리지 않게 (타이머·스톱워치) */
  body { font-variant-numeric: tabular-nums; }
</style>
<style id="font-hanja">
  /* 한자 글꼴 — Pretendard 에 한자가 한 글자도 없어서 따로 담았습니다.
     Noto Sans CJK KR 에서 실제로 쓰는 한자 387자만 뽑은 파일입니다(SIL 오픈폰트 라이선스). */
  @font-face {
    font-family: "Hanja";
    font-style: normal;
    font-display: swap;
    src: url("../fonts/HanjaSubset.woff2") format("woff2");
    /* 한자 영역만 이 글꼴을 쓰게 해서, 한글은 Pretendard 가 그대로 맡습니다. */
    unicode-range: U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
  }
</style>
<script id="drop-guard">
/* 파일을 끌어다 놓아도 수업 화면을 벗어나지 않게 합니다 (scripts/fix-drop-guard.mjs).
   브라우저는 기본으로 끌어다 놓은 파일을 열어 버립니다. */
['dragenter', 'dragover', 'drop'].forEach(function (종류) {
  window.addEventListener(종류, function (e) { e.preventDefault(); }, false);
});
</script>
<script id="answer-once">
/* 한 문제에 한 번만 답하게 합니다 (scripts/fix-double-score.mjs).
   답한 뒤에도 O/X 가 눌려서, 누를 때마다 10점씩 더 오르던 문제를 막습니다.
   («10문제 중 14문제 정답» 같은 결과가 나왔습니다)
   원래 코드는 그대로 두고, 누르는 것을 앞에서 가로채기만 합니다. */
(function () {
  /* «단추를 눌렀나» 가 아니라 «지금 이 문제에 답했나» 로 잠급니다.
     «다음 문제» 를 눌렀는지로 풀면, 마지막 문제의 «결과 보기» 에서도 풀려 버립니다.
     (학교폭력 퀴즈는 결과가 4.2초 걸려서, 그 사이에 또 눌리면 점수가 오릅니다) */
  var 답한문제 = null;

  function 지금문제() {
    var t = (document.body && document.body.innerText || '').replace(/\s+/g, ' ');
    var 번호 = t.match(/문제\s*(\d+)\s*\/\s*(\d+)/);
    var 문장 = t.match(/"([^"]{6,})"/);
    return (번호 ? 번호[0] : '?') + '|' + (문장 ? 문장[1].slice(0, 40) : '?');
  }

  window.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var id = b.id || '';

    /* 처음부터 다시 풀면 잠금을 완전히 풉니다 */
    if (/다시|처음|목록/.test(b.innerText || '')) { 답한문제 = null; return; }

    if (id !== 'btn-choice-o' && id !== 'btn-choice-x') return;

    var 이번 = 지금문제();
    if (답한문제 === 이번) {          /* 이미 답한 그 문제 — 두 번째부터는 막습니다 */
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    답한문제 = 이번;                  /* 첫 답은 그대로 통과시킵니다 */
  }, true);                           /* true = 원래 처리기보다 먼저 받습니다 */
})();
</script>
</body>
</html>
