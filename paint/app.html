<!doctype html>
<html lang="en">
  <head>

    <title>그림판(판서)</title>
    <script type="module" crossorigin src="./assets/index-BXO7XPyu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dhns_zDJ.css">
  <style id="contrast-bump">
/* 보조 글자를 한 단계 진하게 (scripts/fix-contrast.mjs)
   slate-400 은 흰 바탕에서 2.63:1 이라 국제 기준(4.5:1)에 못 미칩니다.
   같은 계열의 slate-500 으로 한 단계만 내려 4.76:1 을 맞춥니다.
   배경·테두리는 그대로 두고 글자 색만 바꿉니다. */
.text-slate-400 { color: #64748B !important; }
.stat-title,
.bar-progress-label,
.backing-volume-label { color: #64748B !important; }   /* 피아노 정확도·진행도·마디·반주 소리 */

/* 타이머의 "다같이 시작해볼까요?" 는 위 utility 를 쓰지 않고 색을 직접 씁니다 */
[class*="text-slate-400"] { color: #64748B !important; }
</style>
<style id="reduced-motion">
/* 기기에서 '동작 줄이기'를 켠 경우에만 적용됩니다 (scripts/fix-reduced-motion.mjs).
   켜지 않은 사람에게는 아무 변화도 없습니다. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
  <body>
    <div id="root"></div>
  <style id="kiosk-guard">
  * { -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; }
</style>
<script data-kiosk-guard>
  /* 길게 누르기 메뉴와 두 손가락 확대만 막습니다.
     앱이 가진 기능은 그대로 두고, 브라우저 기본 동작만 취소합니다. */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
</script>
<style id="font-pretendard">
  /* 글꼴 파일을 이 화면에 직접 연결합니다(빠져 있던 화면이 있었습니다) */
  @font-face {
    font-family: "Pretendard";
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url("../fonts/PretendardVariable.woff2") format("woff2-variations");
  }
  /* 앱마다 제각각이던 글꼴 변수도 전부 Pretendard 로 */
  :root {
    --font-sans: "Pretendard", sans-serif !important;
    --font-mono: "Pretendard", monospace !important;
    --font-rounded: "Pretendard", sans-serif !important;
    --font-display: "Pretendard", sans-serif !important;
  }
  /* 모든 글자를 Pretendard 로. 이모지는 자동으로 시스템 이모지로 넘어갑니다. */
  *, *::before, *::after {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif !important;
  }
  /* 숫자가 바뀔 때 자리폭이 흔들리지 않게 (타이머·스톱워치) */
  body { font-variant-numeric: tabular-nums; }
</style>
<script id="paint-share-trim">
/* 공유 창에서 교실 보드에서 못 쓰는 단추를 감춥니다. (scripts/fix-paint-share.mjs)
   · "스튜디오 링크 공유 복사" — 127.0.0.1 주소라 남에게 보내도 안 열립니다
   · "기기 연동 간편 QR 코드"  — 진짜 QR 이 아니라 점무늬 그림입니다
   PNG 다운로드는 그대로 둡니다. */
(function () {
  var 감출말 = ['스튜디오 링크', '링크 주소 복사', 'QR 코드'];
  function 정리() {
    var bs = document.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (b.dataset.hiddenByToolkit) continue;
      var t = (b.textContent || '').trim();
      for (var j = 0; j < 감출말.length; j++) {
        if (t.indexOf(감출말[j]) >= 0) {
          b.dataset.hiddenByToolkit = '1';
          b.style.display = 'none';
          break;
        }
      }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', 정리);
  else 정리();
  new MutationObserver(정리).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script id="drop-guard">
/* 파일을 끌어다 놓아도 수업 화면을 벗어나지 않게 합니다 (scripts/fix-drop-guard.mjs).
   브라우저는 기본으로 끌어다 놓은 파일을 열어 버립니다. */
['dragenter', 'dragover', 'drop'].forEach(function (종류) {
  window.addEventListener(종류, function (e) { e.preventDefault(); }, false);
});
</script>
</body>
</html>
